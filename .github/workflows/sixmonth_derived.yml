name: Six-Month Derived Layer

# Builds the derived layer (finite-difference speeds, authoritative true
# stations, reference transit-to-natal report) for an EXISTING raw six-month
# feed without regenerating or modifying it. Output: docs/derived/.

on:
  workflow_dispatch:
    inputs:
      raw_file:
        description: "Raw six-month feed (default: newest docs/feed_overlay_6month_*.json by filename timestamp)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sixmonth-derived
  cancel-in-progress: false

jobs:
  derive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest discover -s tests -v

      - name: Record raw feed hash (must not change)
        id: rawhash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          RAW="${{ github.event.inputs.raw_file }}"
          if [ -z "$RAW" ]; then RAW=$(python -c 'from scripts.sixmonth_derived import latest_raw; print(latest_raw().relative_to(__import__("pathlib").Path.cwd()))'); fi
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          sha256sum "$RAW" | tee /tmp/raw.sha256

      - name: Build derived layer
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/sixmonth_derived.py "${{ steps.rawhash.outputs.raw }}"

      - name: Validate derived layer
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/validate_sixmonth_derived.py "${{ steps.rawhash.outputs.raw }}"
          sha256sum -c /tmp/raw.sha256

      - name: Commit derived files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/derived/sixmonth_*.json
          if git diff --cached --quiet; then echo "No derived changes"; exit 0; fi
          git commit -m "Derived six-month layer for ${{ steps.rawhash.outputs.raw }}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
